name: iOS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Xcode
        run: |
          xcodebuild -version
          xcrun simctl list runtimes | grep -i ios || true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Secrets
        env:
          YANDEX_MAPKIT_KEY: ${{ secrets.YANDEX_MAPKIT_KEY }}
        run: ./scripts/write-secrets.sh

      - name: Generate project
        run: xcodegen generate

      - name: Cache Swift packages
        uses: actions/cache@v5
        with:
          path: .spm
          key: spm-${{ hashFiles('project.yml') }}

      - name: Pick simulator
        id: sim
        run: echo "udid=$(python3 scripts/pick-simulator.py)" >> "$GITHUB_OUTPUT"

      - name: Boot simulator
        env:
          SIMULATOR: ${{ steps.sim.outputs.udid }}
        run: |
          xcrun simctl bootstatus "$SIMULATOR" -b
          xcrun simctl location "$SIMULATOR" start --speed=8 \
            41.2856,69.2036 41.2995,69.2401 41.3111,69.2797 41.3260,69.2850 41.3400,69.3000 41.3550,69.3300 \
            || echo "::warning::Location simulation is unavailable"
          nohup xcrun simctl spawn "$SIMULATOR" log stream --level debug --style compact \
            --predicate 'process == "KameraMap"' > app.log 2>&1 &
          echo $! > log-stream.pid

      - name: Build and test
        env:
          SIMULATOR: ${{ steps.sim.outputs.udid }}
        run: |
          set +e
          xcodebuild test \
            -project KameraMap.xcodeproj \
            -scheme KameraMap \
            -destination "id=$SIMULATOR" \
            -clonedSourcePackagesDirPath .spm \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            > xcodebuild.log 2>&1
          status=$?
          grep -E "error:|Test Case .* (passed|failed)|\*\* (BUILD|TEST) " xcodebuild.log | head -300
          exit $status

      - name: Diagnostics
        if: always()
        env:
          YANDEX_MAPKIT_KEY: ${{ secrets.YANDEX_MAPKIT_KEY }}
        run: ./scripts/collect-diagnostics.sh

      - name: Export screenshots
        if: always()
        run: |
          mkdir -p screenshots
          if [ -d TestResults.xcresult ]; then
            xcrun xcresulttool export attachments --path TestResults.xcresult --output-path screenshots || true
          fi
          ls screenshots | head -50

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: screenshots
          path: screenshots
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: build-log
          path: |
            xcodebuild.log
            app.log
            crashes
          if-no-files-found: ignore

  device:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Secrets
        env:
          YANDEX_MAPKIT_KEY: ${{ secrets.YANDEX_MAPKIT_KEY }}
        run: ./scripts/write-secrets.sh

      - name: Generate project
        run: xcodegen generate

      - name: Cache Swift packages
        uses: actions/cache@v5
        with:
          path: .spm
          key: spm-${{ hashFiles('project.yml') }}

      - name: Build for iPhone
        run: |
          set +e
          xcodebuild build \
            -project KameraMap.xcodeproj \
            -scheme KameraMap \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -clonedSourcePackagesDirPath .spm \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            > device-build.log 2>&1
          status=$?
          grep -E "error:|\*\* BUILD " device-build.log | head -100
          exit $status

      - name: Package encrypted IPA
        run: ./scripts/package-ipa.sh build/Build/Products/Release-iphoneos/KameraMap.app

      - uses: actions/upload-artifact@v6
        with:
          name: KameraMap-ipa
          path: |
            KameraMap.ipa.enc
            ipa.key.enc
            KameraMap.ipa.sha256
          retention-days: 14
          if-no-files-found: error

      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: device-build-log
          path: device-build.log
          if-no-files-found: ignore
