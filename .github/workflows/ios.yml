name: iOS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Xcode
        run: |
          xcodebuild -version
          xcrun simctl list runtimes | grep -i ios || true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Secrets
        env:
          YANDEX_MAPKIT_KEY: ${{ secrets.YANDEX_MAPKIT_KEY }}
        run: |
          key=$(printf '%s' "$YANDEX_MAPKIT_KEY" | tr -d '[:space:]')
          if [ -z "$key" ]; then
            echo "::warning::YANDEX_MAPKIT_KEY is empty, the map will show a placeholder"
            exit 0
          fi
          printf 'KM_YANDEX_MAPKIT_KEY = %s\n' "$key" > Config/Secrets.xcconfig
          if printf '%s' "$key" | grep -Eq '^[0-9a-fA-F]{8}(-[0-9a-fA-F]{4}){3}-[0-9a-fA-F]{12}$'; then
            echo "MapKit key: set, ${#key} characters"
          else
            echo "::warning::YANDEX_MAPKIT_KEY is set (${#key} characters) but does not look like a MapKit key"
          fi

      - name: Generate project
        run: xcodegen generate

      - name: Cache Swift packages
        uses: actions/cache@v5
        with:
          path: .spm
          key: spm-${{ hashFiles('project.yml') }}

      - name: Pick simulator
        id: sim
        run: echo "udid=$(python3 scripts/pick-simulator.py)" >> "$GITHUB_OUTPUT"

      - name: Build and test
        env:
          SIMULATOR: ${{ steps.sim.outputs.udid }}
        run: |
          set +e
          xcodebuild test \
            -project KameraMap.xcodeproj \
            -scheme KameraMap \
            -destination "id=$SIMULATOR" \
            -clonedSourcePackagesDirPath .spm \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            > xcodebuild.log 2>&1
          status=$?
          grep -E "error:|Test Case .* (passed|failed)|\*\* (BUILD|TEST) " xcodebuild.log | head -300
          exit $status

      - name: App log
        if: always()
        env:
          SIMULATOR: ${{ steps.sim.outputs.udid }}
          YANDEX_MAPKIT_KEY: ${{ secrets.YANDEX_MAPKIT_KEY }}
        run: |
          xcrun simctl spawn "$SIMULATOR" log show --last 45m --info --debug --style compact \
            --predicate 'process == "KameraMap"' > app.log 2>&1 || true
          key=$(printf '%s' "$YANDEX_MAPKIT_KEY" | tr -d '[:space:]')
          if [ -n "$key" ]; then
            sed -i '' "s/$key/[mapkit-key]/g" app.log
          fi
          sed -E -i '' 's/([Aa][Pp][Ii]_?[Kk][Ee][Yy]=)[^&[:space:]]+/\1[hidden]/g' app.log
          echo "app.log: $(wc -l < app.log) lines"
          grep -iE "yandex|mapkit|tile|error|fail|invalid|forbidden|unauthori|denied|me\.ismoiljon" app.log | tail -150 || true

      - name: Export screenshots
        if: always()
        run: |
          mkdir -p screenshots
          if [ -d TestResults.xcresult ]; then
            xcrun xcresulttool export attachments --path TestResults.xcresult --output-path screenshots || true
          fi
          ls screenshots | head -50

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: screenshots
          path: screenshots
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: build-log
          path: |
            xcodebuild.log
            app.log
          if-no-files-found: ignore
