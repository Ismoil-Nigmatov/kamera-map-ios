name: KameraMap

options:
  bundleIdPrefix: me.ismoiljon
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ru
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

packages:
  YandexMapsMobile:
    url: https://github.com/yandex/mapkit-ios
    exactVersion: 4.47.0

targets:
  KameraMap:
    type: application
    platform: iOS
    sources:
      - path: KameraMap
    configFiles:
      Debug: Config/App.xcconfig
      Release: Config/App.xcconfig
    dependencies:
      - package: YandexMapsMobile
        product: YandexMapsMobileFull
    info:
      path: KameraMap/Info.plist
      properties:
        CFBundleDisplayName: Kamera Map
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: ru
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSLocationWhenInUseUsageDescription: Чтобы показать, где вы, и поставить метку рядом с вами.
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: me.ismoiljon.kameramap
            CFBundleURLSchemes:
              - kameramap
        KMAPIBaseURL: $(KM_API_BASE_URL)
        KMYandexMapKitKey: $(KM_YANDEX_MAPKIT_KEY)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.ismoiljon.kameramap
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        OTHER_LDFLAGS: $(inherited) -ObjC
        GENERATE_INFOPLIST_FILE: NO

  KameraMapTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: KameraMapTests
    dependencies:
      - target: KameraMap
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.ismoiljon.kameramap.tests
        GENERATE_INFOPLIST_FILE: YES

  KameraMapUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: KameraMapUITests
    dependencies:
      - target: KameraMap
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.ismoiljon.kameramap.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: KameraMap

schemes:
  KameraMap:
    build:
      targets:
        KameraMap: all
    test:
      config: Debug
      targets:
        - KameraMapTests
        - KameraMapUITests
    run:
      config: Debug
